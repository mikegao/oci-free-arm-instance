name: Try to Create OCI VM

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-vm.yml"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: create-oci-vm
  cancel-in-progress: false

env:
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
  SUPPRESS_LABEL_WARNING: "True"
  PYTHONWARNINGS: "ignore::FutureWarning"

jobs:
  create-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Cache OCI CLI
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Try to create VM
        id: create_vm
        continue-on-error: true
        shell: bash
        env:
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          AD_NAME: ${{ secrets.AD_NAME }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          IMAGE_ID: ${{ secrets.IMAGE_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -o pipefail

          pip install oci-cli

          required_vars=(
            OCI_CLI_REGION
            OCI_CLI_USER
            OCI_CLI_TENANCY
            OCI_CLI_FINGERPRINT
            OCI_CLI_KEY_CONTENT
            OCI_COMPARTMENT_ID
            AD_NAME
            OCI_SUBNET_ID
            SSH_PUBLIC_KEY
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "Missing required secret: ${var_name}" > "$RUNNER_TEMP/oci-error.log"
              exit 1
            fi
          done

          OCI_CLI_REGION="$(printf '%s' "$OCI_CLI_REGION" | tr -d '[:space:]')"
          case "$OCI_CLI_REGION" in
            USWest\(Phoenix\)|USWestPhoenix|Phoenix)
              OCI_CLI_REGION="us-phoenix-1"
              ;;
            USEast\(Ashburn\)|USEastAshburn|Ashburn)
              OCI_CLI_REGION="us-ashburn-1"
              ;;
            USWest\(SanJose\)|USWestSanJose|SanJose)
              OCI_CLI_REGION="us-sanjose-1"
              ;;
          esac

          if ! grep -Eq '^[a-z]+-[a-z]+-[0-9]+$' <<< "$OCI_CLI_REGION"; then
            {
              echo "Invalid OCI_CLI_REGION: ${OCI_CLI_REGION}"
              echo "Use an OCI region identifier such as us-phoenix-1, not the console display name."
            } > "$RUNNER_TEMP/oci-error.log"
            exit 1
          fi

          COMPUTE_ENDPOINT="https://iaas.${OCI_CLI_REGION}.oraclecloud.com/20160918"
          case "$OCI_CLI_REGION" in
            us-phoenix-1)
              OCID_REGION_KEY="phx"
              ;;
            us-ashburn-1)
              OCID_REGION_KEY="iad"
              ;;
            us-sanjose-1)
              OCID_REGION_KEY="sjc"
              ;;
            *)
              OCID_REGION_KEY="$(printf '%s' "$OCI_CLI_REGION" | sed -E 's/^([a-z]+)-([a-z]+)-([0-9]+)$/\1-\2-\3/')"
              ;;
          esac

          if ! grep -Eq '^[[:alnum:]]+:[[:upper:][:digit:]-]+-AD-[[:digit:]]+$' <<< "$AD_NAME"; then
            {
              echo "Invalid AD_NAME: ${AD_NAME}"
              echo "Use the full availability domain name, for example AbCd:PHX-AD-1."
            } > "$RUNNER_TEMP/oci-error.log"
            exit 1
          fi

          if ! grep -Eq "^ocid1\\.subnet\\.oc1\\.${OCID_REGION_KEY}\\." <<< "$OCI_SUBNET_ID"; then
            {
              echo "OCI_SUBNET_ID does not match the selected OCI region."
              echo "Expected subnet OCID prefix: ocid1.subnet.oc1.${OCID_REGION_KEY}."
            } > "$RUNNER_TEMP/oci-error.log"
            exit 1
          fi

          mkdir -p "$HOME/.oci"
          chmod 700 "$HOME/.oci"
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          if ! tail -n 1 "$HOME/.oci/oci_api_key.pem" | grep -qx 'OCI_API_KEY'; then
            printf 'OCI_API_KEY\n' >> "$HOME/.oci/oci_api_key.pem"
          fi
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_CLI_USER"
            printf 'tenancy=%s\n' "$OCI_CLI_TENANCY"
            printf 'fingerprint=%s\n' "$OCI_CLI_FINGERPRINT"
            printf 'key_file=%s/.oci/oci_api_key.pem\n' "$HOME"
            printf 'region=%s\n' "$OCI_CLI_REGION"
          } > "$HOME/.oci/config"
          chmod 600 "$HOME/.oci/config"

          printf '%s\n' "$SSH_PUBLIC_KEY" > "$HOME/my_ssh_key.pub"

          {
            echo "Preflight checks"
            echo "Compute endpoint: ${COMPUTE_ENDPOINT}"
          } > "$RUNNER_TEMP/oci-error.log"

          if [ -n "$IMAGE_ID" ]; then
            echo "Ignoring configured IMAGE_ID; auto-selecting an Arm-compatible Ubuntu image." >> "$RUNNER_TEMP/oci-error.log"
            IMAGE_ID=""
          fi

          if [ -z "$IMAGE_ID" ]; then
            if ! oci \
              --config-file "$HOME/.oci/config" \
              --profile DEFAULT \
              --region "$OCI_CLI_REGION" \
              compute image list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --shape "VM.Standard.A1.Flex" \
              --operating-system "Canonical Ubuntu" \
              --lifecycle-state AVAILABLE \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --query "data[?contains(\"display-name\", 'aarch64') || contains(\"display-name\", 'arm') || contains(\"display-name\", 'ARM')].id | [0]" \
              --raw-output \
              > "$RUNNER_TEMP/image-id.txt" \
              2>> "$RUNNER_TEMP/oci-error.log"; then
              {
                echo ""
                echo "Could not auto-select a Canonical Ubuntu AArch64 image."
              } >> "$RUNNER_TEMP/oci-error.log"
              exit 1
            fi

            IMAGE_ID="$(cat "$RUNNER_TEMP/image-id.txt")"
          fi

          if [ -z "$IMAGE_ID" ] || [ "$IMAGE_ID" = "null" ]; then
            {
              echo ""
              echo "No compatible Canonical Ubuntu image was found for VM.Standard.A1.Flex."
            } >> "$RUNNER_TEMP/oci-error.log"
            exit 1
          fi

          echo "Using image: ${IMAGE_ID}" >> "$RUNNER_TEMP/oci-error.log"

          if ! oci \
            --config-file "$HOME/.oci/config" \
            --profile DEFAULT \
            --region "$OCI_CLI_REGION" \
            network subnet get \
            --subnet-id "$OCI_SUBNET_ID" \
            > "$RUNNER_TEMP/subnet.json" \
            2>> "$RUNNER_TEMP/oci-error.log"; then
            {
              echo ""
              echo "OCI_SUBNET_ID is not accessible in the selected region, tenancy, or compartment."
            } >> "$RUNNER_TEMP/oci-error.log"
            exit 1
          fi

          if ! oci \
            --config-file "$HOME/.oci/config" \
            --profile DEFAULT \
            --region "$OCI_CLI_REGION" \
            iam availability-domain list \
            --compartment-id "$OCI_CLI_TENANCY" \
            --query "data[?name=='${AD_NAME}'].name | [0]" \
            --raw-output \
            > "$RUNNER_TEMP/ad.txt" \
            2>> "$RUNNER_TEMP/oci-error.log"; then
            {
              echo ""
              echo "Could not list availability domains for the tenancy."
            } >> "$RUNNER_TEMP/oci-error.log"
            exit 1
          fi

          if [ "$(cat "$RUNNER_TEMP/ad.txt")" != "$AD_NAME" ]; then
            {
              echo ""
              echo "AD_NAME is not valid for the selected tenancy and region."
              echo "Expected one of the names returned by: oci iam availability-domain list"
            } >> "$RUNNER_TEMP/oci-error.log"
            exit 1
          fi

          for attempt in 1 2 3; do
            {
              echo "OCI launch attempt ${attempt}"
              echo "Compute endpoint: ${COMPUTE_ENDPOINT}"
              curl --connect-timeout 10 --max-time 20 --silent --show-error --head "$COMPUTE_ENDPOINT" || true
            } > "$RUNNER_TEMP/oci-error.log"

            oci \
              --config-file "$HOME/.oci/config" \
              --profile DEFAULT \
              --region "$OCI_CLI_REGION" \
              --connection-timeout 30 \
              --read-timeout 60 \
              compute instance launch \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":4,"memoryInGBs":24}' \
              --subnet-id "$OCI_SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "$HOME/my_ssh_key.pub" \
              --assign-public-ip true \
              --display-name "luckyowl-vm" \
              --boot-volume-size-in-gbs 200 \
              > "$RUNNER_TEMP/oci-output.json" \
              2>> "$RUNNER_TEMP/oci-error.log"

            exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
              exit 0
            fi

            if ! grep -q 'timed out' "$RUNNER_TEMP/oci-error.log"; then
              exit "$exit_code"
            fi

            sleep 20
          done

          exit "$exit_code"

      - name: Capture OCI output
        if: always()
        id: oci_output
        shell: bash
        run: |
          {
            echo "log_data<<EOF"
            if [ -s "$RUNNER_TEMP/oci-output.json" ]; then
              cat "$RUNNER_TEMP/oci-output.json"
            fi
            if [ -s "$RUNNER_TEMP/oci-error.log" ]; then
              cat "$RUNNER_TEMP/oci-error.log"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate result
        if: always()
        shell: bash
        env:
          LOG_DATA: ${{ steps.oci_output.outputs.log_data }}
        run: |
          if grep -q '"lifecycle-state": "PROVISIONING"' <<< "$LOG_DATA"; then
            echo "VM is being created. Disable this workflow after confirming the VM exists."
            exit 0
          fi

          if grep -q 'Out of host capacity' <<< "$LOG_DATA"; then
            echo "OCI has no Arm capacity right now. The scheduled workflow will retry."
            exit 0
          fi

          echo "$LOG_DATA"
          exit 1

      - name: Send Discord notification
        if: always()
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: ${{ contains(steps.oci_output.outputs.log_data, 'PROVISIONING') && '0x28a745' || contains(steps.oci_output.outputs.log_data, 'Out of host capacity') && '0xffa500' || '0xdc3545' }}
          title: OCI Bot Status
          description: |
            **Result:**
            ${{ contains(steps.oci_output.outputs.log_data, 'PROVISIONING') && 'VM created. Disable this workflow.' || contains(steps.oci_output.outputs.log_data, 'Out of host capacity') && 'Waiting for capacity.' || 'Error.' }}

            **Details:**
            ```json
            ${{ steps.oci_output.outputs.log_data }}
            ```
